<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Killer Stardust - Cursed Arcade</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <audio id="backgroundMusic" src="audio/theme.mp3" loop></audio>
    <canvas id="gameCanvas"></canvas>
    <div id="splash">
        <img class="game-logo" src="images/kdlogo.png" alt="Killer Stardust">
        <img class="cursed-logo" src="images/cursed-logo.png" alt="Cursed Entertainment">
        <p class="copyright">&copy; Cursed Entertainment 2026</p>
        <p class="press">Press any key or tap to start</p>
    </div>
    <div id="score">Score 0</div>
    <div id="help">Arrows / WASD or swipe · P pause · Space play again</div>
    <footer id="dynamicFooter"></footer>
    <script src="https://cursedprograms.github.io/cursedentertainment/scripts/footer.js"></script>
    <script src="scripts/background_music.js"></script>
    <script src="scripts/gameplay.js"></script>
</body>

</html>
